---
- name: Deploy Calculator Container
  hosts: localhost
  become: false
  tasks:

    - name: Pull Docker Image
      docker_image:
        name: ruturaj6536/calculator-app
        source: pull

    - name: Stop old container (if exists)
      shell: docker rm -f calculator
      ignore_errors: yes

    - name: Run Docker container
      shell: docker run -it -d --name calculator ruturaj6536/calculator-app

